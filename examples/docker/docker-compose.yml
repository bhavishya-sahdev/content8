services:
  content8:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set your public origin}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Content8}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set your PostgreSQL connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Content8}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set a publishing secret}
    ports:
      - "3001:3000"
