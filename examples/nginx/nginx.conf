server {
    listen 80;
    server_name yourproject.com;

    # ── Main app ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://main-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── content8 — served at /blog on the same domain ───────────────────────
    location /blog {
        proxy_pass         http://content8:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets. This reserves /_next for content8; do not use with a Next.js main app.
    location /_next/ {
        proxy_pass http://content8:3000;
        proxy_set_header Host $host;
    }

    # ── Webhook endpoint ─────────────────────────────────────────────────────
    location /api/blog {
        proxy_pass         http://content8:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
